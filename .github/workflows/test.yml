# Terraform Provider testing workflow — runs on every PR and push to main.
#
# Fast, no-cloud checks only. The destructive acceptance suite (TF_ACC=1, real
# CRUD against the Data Integration API) is intentionally NOT run here — it needs
# live credentials and creates real resources. Run it out-of-band via `make testacc`
# or a separate scheduled/manual workflow.
name: Tests

on:
  pull_request:
    paths-ignore:
      - "README.md"
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  build:
    name: Build + vet + lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
      - run: go mod download
      - run: go build -v ./...
      - run: go vet ./...
      - name: golangci-lint
        # v2 (built with go1.25) is required: a linter built with an older Go
        # refuses to analyze a module whose go directive is newer than itself,
        # and the go.mod floor is 1.25 (golang.org/x/crypto 0.52 security fix).
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

  docs:
    name: Docs are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # NON-BLOCKING for now. tfplugindocs runs its schema export under a provider
    # local name equal to --provider-name (boomi_data_integration). Terraform
    # >=1.8 forbids underscores in provider local names, so `terraform init`
    # fails on any modern CLI. Making this pass reliably requires reworking the
    # provider's naming (TypeName / registry type alignment), which is a separate
    # decision from this CI/publishing setup. Tracked as a follow-up; until then
    # this job reports drift without blocking the required checks.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false
      - name: Install tfplugindocs
        run: go install github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.21.0
      - name: Regenerate docs
        # provider-name must be the provider TypeName (boomi_data_integration),
        # not the registry type (data-integration) — tfplugindocs strips this
        # prefix from resource/data-source type names.
        run: tfplugindocs generate --provider-name boomi_data_integration
      - name: Fail if docs drifted
        run: |
          git diff --compact-summary --exit-code || {
            echo "::error::docs/ is out of date — run 'make docs' and commit the result."
            exit 1
          }

  fmt:
    name: terraform fmt (examples)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive examples

  test:
    name: Unit tests (Terraform ${{ matrix.terraform }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        terraform:
          - "1.8.*"
          - "1.9.*"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      # TF_ACC is unset → acceptance tests auto-skip; this runs the unit suite only.
      - run: go test -v -cover -count=1 ./internal/...
