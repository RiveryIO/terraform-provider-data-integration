# GoReleaser config for publishing terraform-provider-data-integration to the
# Terraform Registry (signed builds). See https://goreleaser.com and
# https://developer.hashicorp.com/terraform/registry/providers/publishing
version: 2

project_name: terraform-provider-data-integration

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  # The manifest MUST be hashed into SHA256SUMS too — the Terraform Registry
  # rejects a version with "missing SHA256 checksum for ..._manifest.json" if it
  # is only uploaded (release.extra_files) but not checksummed here.
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  # The Terraform Registry requires the manifest to be published alongside the
  # signed archives, named "<project>_<version>_manifest.json".
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  draft: false

changelog:
  disable: true
